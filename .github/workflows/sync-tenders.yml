# Incremental SEAP sync (tenders + awards), every 6 hours.
#
# Calls POST {SYNC_URL}/internal/sync-tenders on the deployed backend. The endpoint is
# idempotent and checkpointed: each run pulls only what arrived since the
# last run (default 48h lookback on a fresh checkpoint), and capped/timed_out
# runs simply continue on the next tick — no overlap, no duplicates.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SYNC_URL    Deployed API base, e.g. https://licits.com/api
#               (on Vercel only /api/* reaches the backend, so keep /api).
#   SYNC_TOKEN  Must equal the backend's SYNC_SECRET env value.
name: Sync SEAP tenders

on:
  schedule:
    # Every 6 hours at minute 17 (off-peak, away from :00/:30 cron herds).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the deployment
        run: |
          curl -sS -L -H "X-Sync-Token: $SYNC_TOKEN" "$SYNC_URL/internal/diagnostics" --max-time 60; echo
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Trigger incremental sync
        run: |
          # -L with --post30x keeps the POST through domain redirects
          # (apex <-> www, http -> https).
          curl -sS --fail-with-body -L --post301 --post302 --post303 -X POST \
            "$SYNC_URL/internal/sync-tenders?include_awards=true" \
            -H "X-Sync-Token: $SYNC_TOKEN" \
            --max-time 600 -o sync-report.json || { cat sync-report.json; echo; exit 1; }
          cat sync-report.json; echo
          python3 -c "
          import json
          r = json.load(open('sync-report.json'))
          print('tenders:', r['tenders_synced'], 'awards:', r['awards_synced'],
                'pdf_errors:', r['awards_pdf_errors'],
                'capped:', r['tenders_capped'] or r['awards_capped'],
                'timed_out:', r['tenders_timed_out'] or r['awards_timed_out'],
                'duration_s:', round(r['duration_seconds'], 1))
          "
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Translate new tenders to English
        # Best effort: a failure here never fails the sync. Skips quietly when the AI key is unset.
        continue-on-error: true
        run: |
          curl -sS -L --post301 --post302 --post303 -X POST \
            "$SYNC_URL/internal/translate-tenders?limit=80" \
            -H "X-Sync-Token: $SYNC_TOKEN" --max-time 300; echo
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
